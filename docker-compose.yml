services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Configure .env}
      POSTGRES_USER: ${POSTGRES_USER:?Configure .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure .env}
    volumes:
      - hospital_data:/var/lib/postgresql/data
      - ./backend/database/databaseConfig.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:?Configure .env}
      DB_USER: ${DB_USER:?Configure .env}
      DB_PASSWORD: ${DB_PASSWORD:?Configure .env}
      JWT_SECRET: ${JWT_SECRET:?Configure .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?Configure .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Configure .env}
      API_PORT: ${API_PORT:-40000}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:40100}
    ports:
      - "${API_PORT:-40000}:${API_PORT:-40000}"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      WEB_PORT: ${WEB_PORT:-40100}
      API_URL: ${API_URL:-http://localhost:40000}
    ports:
      - "${WEB_PORT:-40100}:${WEB_PORT:-40100}"
    depends_on:
      - api

volumes:
  hospital_data:
